<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Favoritos · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css">
<script src="/nc-core/js/core.js"></script></head><body>
<main>
<h1 class="ttl">Favoritos</h1><p class="sub">Suas peças salvas neste aparelho.</p><div class="grid" id="grid"></div>
<div class="empty" id="none" hidden>Você ainda não favoritou nada.<br><a class="btn" id="go" href="#">Ver coleção</a></div>
</main>
<script>
const {P,card,$,fav,R}=NC;$('#go').href=R.categorias;
function draw(){const l=fav.all().map(i=>P[i]).filter(Boolean);$('#grid').innerHTML=l.map(card).join('');$('#none').hidden=!!l.length}
document.addEventListener('nc:update',draw);draw();
</script>
</body></html>

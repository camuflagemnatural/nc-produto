<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedido · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css">
<script src="/nc-core/js/core.js"></script></head><body>
<main>
<div id="app" style="max-width:640px;margin:0 auto;text-align:center"></div>
</main>
<script>
const {$,brl,esc,qs,orders,API,url,R,P}=NC;const id=qs('pedido');let timer;
const o=orders.all().find(x=>x.id===id);
function show(h,t,s){$('#app').innerHTML=`<h1 class="ttl">${h}</h1><p class="sub">${t}</p>${id?`<div class="card" style="padding:18px;text-align:left;margin-bottom:18px"><small style="color:var(--mut)">Pedido</small><div style="word-break:break-all;font-weight:700">${esc(id)}</div>${o?`<div style="margin-top:8px;color:var(--mut)">${o.items.map(l=>`${esc(P[l.i].name)} · ${l.s} × ${l.q}`).join('<br>')}<br><b style="color:var(--bone)">Total: ${brl(o.total)}</b> (${esc(o.method)})</div>`:''}</div><a class="btn" href="${url('rastreio',{pedido:id})}">Acompanhar pedido</a> `:''}<a class="btn sec" href="${R.home}">Voltar à loja</a>`}
async function check(){try{const r=await fetch(`${API}/api/orders/${encodeURIComponent(id)}/status`);if(!r.ok)throw 0;const d=await r.json();
 if(d.approved||d.status==='approved'){clearInterval(timer);show('Peça garantida.','Pagamento aprovado! Obrigado pela compra. Guarde o número do pedido.')}
 else if(['rejected','cancelled','refunded','charged_back'].includes(d.status)){clearInterval(timer);show('Pagamento não aprovado','Status: '+esc(d.status)+'. Você pode tentar novamente na loja.')}
 else show('Aguardando pagamento','Assim que o Mercado Pago confirmar, esta página atualiza sozinha.')}catch{show('Não foi possível consultar agora','Tentaremos de novo em instantes.')}}
if(!id)show('Pedido não informado','Abra esta página a partir do checkout.');else{check();timer=setInterval(check,6000)}
</script>
</body></html>

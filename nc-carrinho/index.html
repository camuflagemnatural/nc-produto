<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrinho · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css">
<script src="/nc-core/js/core.js"></script></head><body>
<main>
<style>.cw{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}.ln{display:flex;gap:14px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.ln:last-child{border:0}.ln img{width:64px;height:90px;object-fit:contain;background:#f7f7f9;border-radius:10px}.ln .i{flex:1;font-size:14px}.ln small{color:var(--mut)}.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--bone);cursor:pointer}.rm{background:none;border:0;color:var(--mut);cursor:pointer;font-size:12px;text-decoration:underline}.sm{padding:20px;display:grid;gap:12px;position:sticky;top:90px}.sm div.r{display:flex;justify-content:space-between;color:var(--mut)}.sm .t{color:var(--bone);font:800 20px Unbounded}@media(max-width:800px){.cw{grid-template-columns:1fr}.sm{position:static}}</style>
<h1 class="ttl">Carrinho</h1><div id="app"></div>
</main>
<script>
const {P,$,brl,esc,cart,store,shipFor,totals,url,R}=NC;
function draw(){const c=cart.all();
 if(!c.length){$('#app').innerHTML=`<div class="empty">Seu carrinho está vazio.<br><a class="btn" href="${R.categorias}">Ver coleção</a></div>`;return}
 const T=totals('pix');
 $('#app').innerHTML=`<div class="cw"><div class="card">${c.map((l,k)=>`<div class="ln"><a href="${url('produto',{id:l.i})}"><img src="${P[l.i].imgs[0]}" alt=""></a><div class="i">${esc(P[l.i].name)}<br><small>Tam. ${l.s} · ${brl(P[l.i].price)}</small><br><button class="rm" data-k="${k}" data-q="0">Remover</button></div><div class="q"><button data-k="${k}" data-q="${l.q-1}" aria-label="Menos">−</button>${l.q}<button data-k="${k}" data-q="${l.q+1}" aria-label="Mais">+</button></div></div>`).join('')}</div>
 <aside class="card sm"><div class="r"><span>Subtotal</span><span>${brl(T.sub)}</span></div>
 <div><label for="cep">CEP para frete</label><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" value="${esc(store.get('cep',''))}"></div>
 <div class="r"><span>Frete</span><span id="fr">${T.fr==null?'Informe o CEP':T.fr?brl(T.fr):'Grátis'}</span></div>
 <div class="r"><span>Desconto Pix (5%)</span><span>− ${brl(T.d)}</span></div>
 <div class="r t"><span>Total no Pix</span><span>${brl(T.t)}</span></div>
 <a class="btn full" href="${R.checkout}">Finalizar compra</a><a class="btn sec full" href="${R.categorias}">Continuar comprando</a>
 <small style="color:var(--mut)">O total final é confirmado pelo servidor no pagamento. No cartão não há desconto Pix.</small></aside></div>`;
 $('.card').onclick=e=>{const b=e.target.closest('[data-k]');if(b)cart.setQty(+b.dataset.k,+b.dataset.q)};
 $('#cep').oninput=e=>{const v=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;if(v.length===8){store.set('cep',e.target.value)}};}
document.addEventListener('nc:update',()=>{if(document.activeElement?.id!=='cep')draw()});
document.addEventListener('change',e=>{if(e.target.id==='cep')draw()});draw();
</script>
</body></html>

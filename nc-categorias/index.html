<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coleção · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css">
<script src="/nc-core/js/core.js"></script></head><body>
<main>
<style>.bn{position:relative;min-height:200px;border-radius:22px;overflow:hidden;margin-bottom:24px;display:grid;align-items:end;background:linear-gradient(120deg,#18232a,#4a5a5f 60%,#6b9494)}.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.bn::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(5,7,8,.8))}.bn div{position:relative;z-index:1;padding:24px}.sort{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.sort select{width:auto}</style>
<div class="bn"><img src="/nc-core/assets/banners/colecao.jpg" alt="" onerror="this.remove()"><div><h1 class="ttl">Collection Classic</h1><p class="sub" style="margin:0">Oversized tees em cinco cores. Escolha a sua.</p></div></div>
<div class="sort"><div class="chips" id="chips" style="margin:0"></div><div><label class="sr" for="so">Ordenar</label><select id="so"><option value="0">Destaques</option><option value="1">Menor preço</option><option value="2">Nome (A–Z)</option></select></div></div>
<div class="grid" id="grid"></div><p class="empty" id="none" hidden>Nenhuma peça nesta cor.</p>
</main>
<script>
const {P,card,$,esc,qs}=NC;let cor=qs('cor')||'';
const cores=[...new Set(P.map(p=>p.cor))];
function draw(){
 $('#chips').innerHTML=['Todas',...cores].map(c=>`<button type="button" class="chip" aria-pressed="${(c==='Todas'&&!cor)||c===cor}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 let l=P.filter(p=>!cor||p.cor===cor);const s=$('#so').value;
 if(s==='1')l.sort((a,b)=>a.price-b.price);if(s==='2')l.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
 $('#grid').innerHTML=l.map(card).join('');$('#none').hidden=!!l.length;}
$('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cor=b.dataset.c==='Todas'?'':b.dataset.c;history.replaceState(null,'',cor?'?cor='+encodeURIComponent(cor):location.pathname);draw()};
$('#so').onchange=draw;draw();
</script>
</body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha conta · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css">
<script src="/nc-core/js/core.js"></script></head><body>
<main>
<h1 class="ttl">Minha conta</h1><p class="sub">Seus dados e pedidos ficam salvos neste aparelho. Login para acessar de qualquer dispositivo chega junto com o back-end.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start">
<form id="fm" class="card" style="padding:20px;display:grid;gap:12px"><h2 style="font-size:16px">Meus dados</h2>
<div class="f"><div class="w"><label for="nome">Nome</label><input id="nome" autocomplete="name"></div><div class="w"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email"></div><div><label for="cep">CEP</label><input id="cep" inputmode="numeric" maxlength="9"></div><div><label for="numero">Número</label><input id="numero"></div><div class="w"><label for="rua">Endereço</label><input id="rua"></div><div><label for="bairro">Bairro</label><input id="bairro"></div><div><label for="cidade">Cidade</label><input id="cidade"></div><div><label for="uf">UF</label><input id="uf" maxlength="2" style="text-transform:uppercase"></div></div>
<button class="btn" type="submit">Salvar</button><button class="btn sec" type="button" id="clr">Apagar dados deste aparelho</button></form>
<div class="card" style="padding:20px"><h2 style="font-size:16px;margin-bottom:12px">Meus pedidos</h2><div id="ord"></div></div></div>
</main>
<script>
const {$,$$,esc,brl,store,orders,url,toast,R}=NC;
const F=['nome','email','cep','numero','rua','bairro','cidade','uf'];
function fill(){const c=store.get('customer',{});F.forEach(k=>$('#'+k).value=c[k]||'');
 const o=orders.all();$('#ord').innerHTML=o.length?o.map(x=>`<a href="${url('rastreio',{pedido:x.id})}" style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><span>${new Date(x.date).toLocaleDateString('pt-BR')} · ${esc(x.method)}</span><b>${brl(x.total)}</b></a>`).join(''):`<div class="empty">Nenhum pedido ainda.<br><a class="btn" href="${R.categorias}">Ver coleção</a></div>`}
$('#fm').onsubmit=e=>{e.preventDefault();const c=store.get('customer',{});F.forEach(k=>c[k]=$('#'+k).value.trim());store.set('customer',c);toast('Dados salvos neste aparelho')};
$('#clr').onclick=()=>{if(confirm('Apagar seus dados e histórico de pedidos deste aparelho?')){['customer','orders','cep'].forEach(k=>localStorage.removeItem('nc.'+k));fill();toast('Dados apagados')}};
fill();
</script>
</body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Busca · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css">
<script src="/nc-core/js/core.js"></script></head><body>
<main>
<h1 class="ttl" id="h">Busca</h1><p class="sub" id="s"></p><div class="grid" id="grid"></div>
<div class="empty" id="none" hidden>Nada encontrado. Tente "preta", "verde" ou o nome da peça.<br><a class="btn" id="all" href="#">Ver toda a coleção</a></div>
</main>
<script>
const {P,card,$,qs,R}=NC;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const q=(qs('q')||'').trim(),t=norm(q).split(/\s+/).filter(Boolean);
const r=t.length?P.filter(p=>t.every(w=>norm(p.name+' '+p.cor+' camiseta oversized').includes(w))):[];
$('#h').textContent=q?`Resultados para "${q}"`:'Busca';
$('#s').textContent=q?`${r.length} ${r.length===1?'peça encontrada':'peças encontradas'}`:'Digite o que procura na barra acima.';
$('#grid').innerHTML=r.map(card).join('');$('#none').hidden=!q||!!r.length;$('#all').href=R.categorias;
</script>
</body></html>
